<style>
:root {
  --bg: #ffffff;
  --panel: #ffffff;
  --sub: #f6f6f3;
  --sub-2: #efefeb;
  --line: #e7e7e2;
  --line-strong: #d6d6cf;
  --ink: #1b1b19;
  --ink-2: #3d3d39;
  --muted: #6f6f69;
  --faint: #9a9a93;
  --accent: #5b7a1f;
  --accent-ink: #ffffff;
  --accent-soft: color-mix(in srgb, var(--accent) 14%, var(--bg));
  --note-bg: #eef4fb; --note-line: #c9dcf2; --note-ink: #1d4f86;
  --tip-bg: #eef5ea; --tip-line: #cfe3c4; --tip-ink: #2f6a1d;
  --info-bg: #f3f3f0; --info-line: #dfdfd8; --info-ink: #4a4a45;
  --warn-bg: #fdf5e6; --warn-line: #f1dcaa; --warn-ink: #8a5a00;
  --danger-bg: #fcefee; --danger-line: #f1cbc8; --danger-ink: #a0302a;
  --check-bg: #ecf6ef; --check-line: #c6e4cf; --check-ink: #226a3b;
  --shadow: 0 1px 2px rgba(20, 20, 15, .04), 0 8px 24px rgba(20, 20, 15, .08);
  --font-body: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-display: "Newsreader", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --font-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --fs-xs: 13px;
  --fs-sm: 14px;
  --fs-base: 16px;
  --fs-lg: 18px;
  --fs-h2: 28px;
  --fs-h1: 44px;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300;
  --sidebar-w: 288px;
  --toc-w: 232px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131312; --panel: #131312; --sub: #1c1c1a; --sub-2: #242421;
    --line: #2a2a27; --line-strong: #3a3a36;
    --ink: #ecece8; --ink-2: #cfcfca; --muted: #9c9c95; --faint: #6f6f69;
    --accent: #a7c865; --accent-ink: #131312;
    --note-bg: #152131; --note-line: #243a55; --note-ink: #9cc3ef;
    --tip-bg: #17221a; --tip-line: #28402c; --tip-ink: #a3d49a;
    --info-bg: #1d1d1b; --info-line: #30302c; --info-ink: #c4c4be;
    --warn-bg: #261f10; --warn-line: #4a3a17; --warn-ink: #eec46a;
    --danger-bg: #2a1616; --danger-line: #4d2624; --danger-ink: #f0a39d;
    --check-bg: #142219; --check-line: #244330; --check-ink: #8fd3a5;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 12px 32px rgba(0, 0, 0, .45);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131312; --panel: #131312; --sub: #1c1c1a; --sub-2: #242421;
  --line: #2a2a27; --line-strong: #3a3a36;
  --ink: #ecece8; --ink-2: #cfcfca; --muted: #9c9c95; --faint: #6f6f69;
  --accent: #a7c865; --accent-ink: #131312;
  --note-bg: #152131; --note-line: #243a55; --note-ink: #9cc3ef;
  --tip-bg: #17221a; --tip-line: #28402c; --tip-ink: #a3d49a;
  --info-bg: #1d1d1b; --info-line: #30302c; --info-ink: #c4c4be;
  --warn-bg: #261f10; --warn-line: #4a3a17; --warn-ink: #eec46a;
  --danger-bg: #2a1616; --danger-line: #4d2624; --danger-ink: #f0a39d;
  --check-bg: #142219; --check-line: #244330; --check-ink: #8fd3a5;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 12px 32px rgba(0, 0, 0, .45);
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300;
  color-scheme: dark;
}
/*__THEME_CSS__*/

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: 88px; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Sidebar ---------- */
.sidebar {
  position: fixed; top: 0; bottom: 0; left: 0;
  width: var(--sidebar-w);
  padding: calc(20px + env(safe-area-inset-top, 0px)) 20px calc(24px + env(safe-area-inset-bottom, 0px));
  border-right: 1px solid var(--line);
  background: var(--panel);
  overflow-y: auto;
  display: flex; flex-direction: column; gap: 20px;
  z-index: 30;
}
.brand-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 36px; }
.brand { display: flex; align-items: center; text-decoration: none; min-width: 0; }
.brand-name { font-weight: 600; font-size: var(--fs-lg); letter-spacing: -.01em; line-height: 1.2; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.theme-toggle { display: flex; gap: 2px; padding: 3px; border: 1px solid var(--line); border-radius: 999px; flex: none; }
.theme-toggle button {
  width: 26px; height: 22px; border: 0; border-radius: 999px; background: transparent;
  display: grid; place-items: center; color: var(--faint); cursor: pointer;
}
.theme-toggle button[aria-pressed="true"] { background: var(--sub-2); color: var(--ink); }
.theme-toggle svg { width: 14px; height: 14px; display: block; }
.i { display: inline-grid; place-items: center; flex: none; }
.i svg { display: block; }

.search-trigger {
  display: flex; align-items: center; gap: 10px; width: 100%;
  padding: 9px 12px; border: 1px solid var(--line); border-radius: 12px;
  background: var(--panel); color: var(--muted); cursor: pointer; text-align: left;
  font-size: var(--fs-base); transition: border-color .15s;
}
.search-trigger:hover { border-color: var(--line-strong); }
.search-trigger svg { width: 16px; height: 16px; flex: none; }
.search-trigger #search-label { flex: 1; }
kbd {
  font-family: var(--font-mono); font-size: var(--fs-xs); line-height: 1.4; color: var(--faint);
  border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; background: var(--sub);
}

.nav { display: flex; flex-direction: column; gap: 26px; }
.nav-group-title { font-weight: 600; font-size: var(--fs-base); letter-spacing: -.01em; margin: 0 0 8px; color: var(--ink); line-height: 1.3; }
.nav-list { list-style: none; margin: 0; padding: 0; border-left: 1px solid var(--line); }
.nav-list .nav-list { margin-left: 12px; }
.nav-link, .nav-sub {
  display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%;
  padding: 6px 12px 6px 14px; margin-left: -1px;
  border: 0; border-left: 2px solid transparent; background: none;
  font-size: var(--fs-base); line-height: 1.4; color: var(--ink-2); text-decoration: none; text-align: left; cursor: pointer;
}
.nav-link:hover, .nav-sub:hover { color: var(--ink); border-left-color: var(--line-strong); }
.nav-link[aria-current="page"] { color: var(--ink); font-weight: 600; border-left-color: var(--ink); }
.nav-sub svg { width: 14px; height: 14px; color: var(--faint); transition: transform .15s; flex: none; }
.nav-sub[aria-expanded="true"] svg { transform: rotate(90deg); }
.sidebar-foot { margin-top: auto; font-size: var(--fs-xs); color: var(--faint); line-height: 1.5; }

/* ---------- Main ---------- */
.main { margin-left: var(--sidebar-w); min-height: 100vh; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--bg); border-bottom: 1px solid var(--line);
  padding-inline: clamp(16px, 4vw, 64px);
}
.topbar[data-empty="true"] { border-bottom: 0; background: transparent; position: static; }
.topbar-inner { display: flex; align-items: center; gap: 12px; min-height: 0; }
.main .mobile-only { display: none; }
.icon-btn {
  width: 36px; height: 36px; border: 1px solid var(--line); border-radius: 10px;
  background: var(--panel); display: grid; place-items: center; cursor: pointer; color: var(--ink-2); flex: none;
}
.icon-btn svg { width: 18px; height: 18px; }
.tabs-nav { display: flex; gap: 28px; overflow-x: auto; scrollbar-width: none; }
.tabs-nav::-webkit-scrollbar { display: none; }
.tabs-nav a {
  display: block; padding: 17px 0 15px; border-bottom: 2px solid transparent;
  text-decoration: none; color: var(--muted); font-weight: 500; font-size: var(--fs-base); white-space: nowrap;
}
.tabs-nav a:hover { color: var(--ink); }
.tabs-nav a[aria-current="true"] { color: var(--ink); border-bottom-color: var(--ink); }

.content-wrap {
  flex: 1;
  display: grid; grid-template-columns: minmax(0, 1fr) var(--toc-w);
  gap: clamp(32px, 5vw, 80px);
  padding: 56px clamp(16px, 4vw, 64px) 96px;
  max-width: 1200px; width: 100%; margin: 0 auto;
}
.content-wrap[data-mode="wide"] { grid-template-columns: minmax(0, 1fr); max-width: 980px; }
.content-wrap[data-mode="wide"] .toc { display: none; }
.page { min-width: 0; max-width: 760px; width: 100%; margin: 0 auto; }
.content-wrap[data-mode="wide"] .page { max-width: 900px; }

.page-eyebrow { font-size: var(--fs-sm); font-weight: 500; color: var(--muted); margin: 0 0 8px; }
.page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; }
.page-title {
  font-family: var(--font-display); font-weight: 400; font-size: clamp(34px, 5vw, var(--fs-h1));
  line-height: 1.1; letter-spacing: -.015em; margin: 0; text-wrap: balance;
  font-optical-sizing: auto;
}
.copy-btn {
  display: inline-flex; align-items: center; gap: 8px; flex: none; margin-top: 6px;
  padding: 7px 13px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel);
  font-size: var(--fs-sm); color: var(--ink-2); cursor: pointer; white-space: nowrap;
}
.copy-btn:hover { border-color: var(--line-strong); color: var(--ink); }
.copy-btn svg { width: 15px; height: 15px; }
.page-lead { font-size: var(--fs-base); line-height: 1.7; color: var(--ink-2); margin: 20px 0 0; text-wrap: pretty; }

/* ---------- Prose ---------- */
.prose { margin-top: 28px; }
.prose > :first-child { margin-top: 0; }
.prose p, .prose ul, .prose ol, .prose blockquote, .prose .table-wrap, .prose pre { margin: 0 0 18px; }
.prose h2 {
  font-family: var(--font-display); font-weight: 400; font-size: var(--fs-h2); line-height: 1.2;
  letter-spacing: -.01em; margin: 52px 0 16px; text-wrap: balance;
}
.prose h3 { font-size: var(--fs-lg); font-weight: 600; letter-spacing: -.005em; line-height: 1.35; margin: 36px 0 10px; }
.prose h4 { font-size: var(--fs-base); font-weight: 600; margin: 28px 0 8px; }
.prose h2, .prose h3, .prose h4 { scroll-margin-top: 88px; }
.prose .heading-anchor { color: inherit; text-decoration: none; }
.prose .heading-anchor:hover { text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 6px; }
.prose a { color: var(--ink); text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 1.5px; text-underline-offset: 4px; }
.prose a:hover { text-decoration-thickness: 2.5px; }
.prose strong { font-weight: 600; color: var(--ink); }
.prose ul, .prose ol { padding-left: 1.4em; }
.prose li { margin: 6px 0; padding-left: 4px; }
.prose li::marker { color: var(--faint); }
.prose li > ul, .prose li > ol { margin: 6px 0 0; }
.prose li input[type="checkbox"] { margin: 0 8px 0 -2px; accent-color: var(--accent); }
.prose hr { border: 0; border-top: 1px solid var(--line); margin: 40px 0; }
.prose blockquote { margin-left: 0; padding: 2px 0 2px 18px; border-left: 3px solid var(--line-strong); color: var(--ink-2); }
.prose code {
  font-family: var(--font-mono); font-size: .86em; background: var(--sub); border: 1px solid var(--line);
  border-radius: 6px; padding: .1em .4em;
}
.prose pre {
  background: var(--sub); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px;
  overflow-x: auto; font-size: var(--fs-sm); line-height: 1.6;
}
.prose pre code { background: none; border: 0; padding: 0; font-size: inherit; }
.prose img { max-width: 100%; height: auto; border-radius: 12px; border: 1px solid var(--line); display: block; background: #ffffff; cursor: zoom-in; }
.prose a img { cursor: pointer; }
.prose .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
.tfilter { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 10px; }
.tfilter input, .tfilter select { font: inherit; font-size: var(--fs-sm); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 0 10px; height: 34px; min-width: 0; }
.tfilter input { flex: 1 1 220px; }
.tfilter select { flex: 0 1 auto; max-width: 240px; cursor: pointer; }
.tfilter input:focus, .tfilter select:focus { outline: none; border-color: var(--line-strong); }
.tfilter .tcount { font-size: var(--fs-sm); color: var(--muted); margin-left: auto; white-space: nowrap; }
.tfilter .tclear { font: inherit; font-size: var(--fs-sm); color: var(--muted); background: none; border: 0; cursor: pointer; padding: 0 4px; text-decoration: underline; text-underline-offset: 3px; }
.prose table { border-collapse: collapse; width: 100%; font-size: var(--fs-sm); line-height: 1.5; font-variant-numeric: tabular-nums; }
.prose th, .prose td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
.prose th { font-weight: 600; background: var(--sub); white-space: nowrap; }
.prose tr:last-child td { border-bottom: 0; }
.prose .ref { border-bottom: 1px dotted var(--line-strong); }

/* ---------- Components ---------- */
.callout {
  display: flex; gap: 12px; padding: 14px 16px; margin: 0 0 18px;
  border: 1px solid var(--c-line); background: var(--c-bg); border-radius: 12px; color: var(--ink);
}
.callout-icon { flex: none; width: 18px; height: 18px; margin-top: 4px; color: var(--c-ink); }
.callout-icon svg { width: 18px; height: 18px; display: block; }
.callout-body { min-width: 0; flex: 1; font-size: var(--fs-base); line-height: 1.65; }
.callout-body > :last-child { margin-bottom: 0; }
.prose .callout-title { font-weight: 600; margin: 0 0 4px; color: var(--c-ink); }
.callout-note { --c-bg: var(--note-bg); --c-line: var(--note-line); --c-ink: var(--note-ink); }
.callout-tip { --c-bg: var(--tip-bg); --c-line: var(--tip-line); --c-ink: var(--tip-ink); }
.callout-info { --c-bg: var(--info-bg); --c-line: var(--info-line); --c-ink: var(--info-ink); }
.callout-warning { --c-bg: var(--warn-bg); --c-line: var(--warn-line); --c-ink: var(--warn-ink); }
.callout-danger { --c-bg: var(--danger-bg); --c-line: var(--danger-line); --c-ink: var(--danger-ink); }
.callout-check { --c-bg: var(--check-bg); --c-line: var(--check-line); --c-ink: var(--check-ink); }

.steps { list-style: none; padding: 0; margin: 8px 0 22px; }
.step { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 16px; position: relative; padding-bottom: 22px; margin: 0; }
.step:not(:last-child)::before { content: ""; position: absolute; left: 13.5px; top: 34px; bottom: 4px; width: 1px; background: var(--line); }
.step-num {
  width: 28px; height: 28px; border-radius: 50%; background: var(--sub-2); color: var(--ink);
  display: grid; place-items: center; font-size: var(--fs-xs); font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 1px;
}
.prose .step-title { font-weight: 600; margin: 1px 0 6px; line-height: 1.5; }
.step-body > :last-child { margin-bottom: 0; }

.tabs { border: 1px solid var(--line); border-radius: 14px; margin: 0 0 22px; overflow: hidden; }
.tab-list { display: flex; gap: 24px; padding: 0 20px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tab-list button {
  border: 0; background: none; padding: 13px 0 11px; border-bottom: 2px solid transparent;
  color: var(--muted); font-weight: 500; cursor: pointer; white-space: nowrap; font-size: var(--fs-base);
}
.tab-list button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
.tab-panel { padding: 20px; }
.tab-panel > :last-child { margin-bottom: 0; }

.card-group { display: grid; grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr)); gap: 14px; margin: 0 0 22px; }
.card {
  display: flex; flex-direction: column; gap: 6px; padding: 18px 18px 16px; border: 1px solid var(--line);
  border-radius: 14px; background: var(--panel); text-decoration: none; color: inherit; min-width: 0;
  transition: border-color .15s, transform .15s;
}
.prose a.card { text-decoration: none; }
a.card:hover { border-color: var(--accent); }
.card-icon { width: 20px; height: 20px; color: var(--accent); margin-bottom: 8px; }
.card-icon svg { width: 20px; height: 20px; display: block; }
.prose .card-title { font-weight: 600; line-height: 1.4; margin: 0; }
.card-body { color: var(--muted); font-size: var(--fs-sm); line-height: 1.6; }
.card-body > :last-child { margin-bottom: 0; }
.prose .card-body p { margin-bottom: 8px; }
.card-group > .card { margin: 0; }

.accordion-group { border: 1px solid var(--line); border-radius: 14px; margin: 0 0 22px; overflow: hidden; }
.accordion { border: 1px solid var(--line); border-radius: 14px; margin: 0 0 12px; }
.accordion-group .accordion { border: 0; border-radius: 0; margin: 0; border-bottom: 1px solid var(--line); }
.accordion-group .accordion:last-child { border-bottom: 0; }
.accordion summary {
  list-style: none; cursor: pointer; padding: 14px 18px; font-weight: 500;
  display: flex; align-items: center; gap: 10px;
}
.accordion summary::-webkit-details-marker { display: none; }
.accordion summary svg { width: 14px; height: 14px; color: var(--faint); transition: transform .15s; flex: none; }
.accordion[open] summary svg { transform: rotate(90deg); }
.accordion-body { padding: 0 18px 14px 42px; }
.accordion-body > :last-child { margin-bottom: 0; }

.frame { margin: 0 0 22px; padding: 8px; border: 1px solid var(--line); border-radius: 16px; background: var(--sub); }
.frame img { border: 0; border-radius: 10px; margin: 0 auto; }
.frame > :last-child { margin-bottom: 0; }
.frame figcaption { font-size: var(--fs-sm); color: var(--muted); text-align: center; padding: 8px 8px 2px; }

.update { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 24px; padding: 0 0 28px; margin: 0 0 28px; border-bottom: 1px solid var(--line); }
.update:last-child { border-bottom: 0; }
.update-label {
  display: inline-block; font-size: var(--fs-xs); font-weight: 600; padding: 2px 10px; border-radius: 999px;
  background: var(--accent-soft); color: var(--ink); font-variant-numeric: tabular-nums;
}
.update-desc { display: block; font-size: var(--fs-sm); color: var(--muted); margin-top: 8px; line-height: 1.45; }
.update-body > :first-child { margin-top: 0; }
.update-body > :last-child { margin-bottom: 0; }
.update-meta { position: sticky; top: 90px; align-self: start; }

.badge {
  display: inline-flex; align-items: center; gap: 6px; vertical-align: 1px;
  font-size: var(--fs-xs); font-weight: 600; line-height: 1.5; padding: 1px 9px; border-radius: 999px;
  border: 1px solid var(--c-line); background: var(--c-bg); color: var(--c-ink); white-space: nowrap;
}
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.badge-green { --c-bg: var(--check-bg); --c-line: var(--check-line); --c-ink: var(--check-ink); }
.badge-blue { --c-bg: var(--note-bg); --c-line: var(--note-line); --c-ink: var(--note-ink); }
.badge-amber { --c-bg: var(--warn-bg); --c-line: var(--warn-line); --c-ink: var(--warn-ink); }
.badge-red { --c-bg: var(--danger-bg); --c-line: var(--danger-line); --c-ink: var(--danger-ink); }
.badge-gray { --c-bg: var(--info-bg); --c-line: var(--info-line); --c-ink: var(--info-ink); }

/* ---------- Metrics ---------- */
/* Each card spans four shared rows (label, value, status, note) so values and badges line up
   across cards even when only some of them carry a status or a note. The size container sits
   on the group, not the card: containment on the card would switch its subgrid off. */

    return String(s || "")
      .replace(/```[\s\S]*?```/g, " ")
      .replace(/\u0000\d+\u0000/g, " ")
      .replace(/!\[[^\]]*\]\([^)]*\)/g, " ")
      .replace(/\[\[([^\]|#]+)(?:#[^\]|]*)?(?:\|([^\]]*))?\]\]/g, function (_, a, b) { return b || humanize(a); })
      .replace(/\[([^\]]*)\]\([^)]*\)/g, "$1")
      .replace(/<[^>]+>/g, function (tag) { var t = tag.match(/\b(?:title|label|description)="([^"]*)"/g); return t ? " " + t.map(function (x) { return x.replace(/^\w+="|"$/g, ""); }).join(" ") + " " : " "; })
      .replace(/^>\s*\[![^\]]+\]/gm, " ")
      .replace(/[#>*_`|~-]+/g, " ")
      .replace(/\s+/g, " ").trim();
  }
  var INDEX = [];
  order.forEach(function (slug) {
    var p = PAGES[slug], info = pageInfo[slug];
    var path = [tabs[info.tab] && tabs[info.tab].tab, info.group].filter(Boolean).join(" › ");
    var body = mask(p.body || "").text;
    var parts = body.split(/\n(?=#{2,3}\s)/);
    var seen = {};
    INDEX.push({ slug: slug, anchor: null, title: p.title || titleOf(slug), path: path, text: plain((p.description || "") + " " + parts[0]), weight: 3 });
    parts.slice(1).forEach(function (sec) {
      var m = sec.match(/^#{2,3}\s+(.+)/); if (!m) return;
      var htext = plain(m[1]);
      var base = slugify(htext), id = base, n = 2;
      while (seen[id]) id = base + "-" + n++;
      seen[id] = 1;
      INDEX.push({ slug: slug, anchor: slug + "~" + id, title: htext, page: p.title || titleOf(slug), path: path, text: plain(sec.replace(/^#{2,3}\s+.+/, "")), weight: 1 });
    });
  });
  function norm(s) { return String(s).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase(); }
  INDEX.forEach(function (r) { r.nTitle = norm(r.title); r.nText = norm(r.text); r.nPage = norm(r.page || ""); });

  var results = [], sel = 0;
  function search(q) {
    var terms = norm(q).split(/\s+/).filter(Boolean);
    if (!terms.length) {
      results = order.slice(0, 8).map(function (s) { return INDEX.filter(function (r) { return r.slug === s && !r.anchor; })[0]; });
    } else {
      results = INDEX.map(function (r) {
        var score = 0;
        for (var i = 0; i < terms.length; i++) {
          var t = terms[i], s = 0;
          if (r.nTitle.indexOf(t) >= 0) s += 10 * r.weight;
          if (r.nPage.indexOf(t) >= 0) s += 2;
          if (r.nText.indexOf(t) >= 0) s += 1 + Math.min(3, r.nText.split(t).length - 2);
          if (!s) return null;
          score += s;
        }
        return { r: r, score: score };
      }).filter(Boolean).sort(function (a, b) { return b.score - a.score; }).slice(0, 12).map(function (x) { return x.r; });
    }
    sel = 0;
    drawResults(terms, q);
  }
  function highlight(text, terms) {
    var out = esc(text);
    terms.forEach(function (t) {
      if (t.length < 2) return;
      var src = norm(text), idx = src.indexOf(t);
      if (idx < 0) return;
      out = esc(text.slice(0, idx)) + "<mark>" + esc(text.slice(idx, idx + t.length)) + "</mark>" + esc(text.slice(idx + t.length));
    });
    return out;
  }
  function snippet(r, terms) {
    var t = r.text;
    if (!terms.length) return t.slice(0, 140);
    var i = norm(t).indexOf(terms[0]);
    if (i < 0) return t.slice(0, 140);
    var start = Math.max(0, i - 50);
    return (start ? "…" : "") + t.slice(start, start + 150) + (start + 150 < t.length ? "…" : "");
  }
  function drawResults(terms, q) {
    var ul = $("search-results");
    if (!results.length) { ul.innerHTML = '<li class="search-empty">' + T.noResults + " “" + esc(q) + "”</li>"; return; }
    ul.innerHTML = results.map(function (r, i) {
      var href = "#" + (r.anchor || r.slug);
      var path = r.anchor ? [r.path, r.page].filter(Boolean).join(" › ") : r.path;
      return '<li><a href="' + href + '" role="option" aria-selected="' + (i === sel) + '" data-i="' + i + '">' +
        (path ? '<span class="sr-path">' + esc(path) + "</span>" : "") +
        '<span class="sr-title">' + highlight(r.title, terms) + "</span>" +
        '<span class="sr-snippet">' + highlight(snippet(r, terms), terms) + "</span></a></li>";
    }).join("");
  }
  function moveSel(d) {
    if (!results.length) return;
    sel = (sel + d + results.length) % results.length;
    Array.prototype.forEach.call(document.querySelectorAll("#search-results a"), function (a, i) {
      a.setAttribute("aria-selected", String(i === sel));
      if (i === sel) a.scrollIntoView({ block: "nearest" });
    });
  }
  function openSearch() {
    $("search-overlay").hidden = false;
    $("search-input").value = "";
    search("");
    setTimeout(function () { $("search-input").focus(); }, 0);
  }
  function closeSearch() { $("search-overlay").hidden = true; }
  $("search-trigger").addEventListener("click", openSearch);
  $("search-btn-mobile").addEventListener("click", openSearch);
  $("search-input").addEventListener("input", function (e) { search(e.target.value); });
  $("search-input").addEventListener("keydown", function (e) {
    if (e.key === "ArrowDown") { e.preventDefault(); moveSel(1); }
    else if (e.key === "ArrowUp") { e.preventDefault(); moveSel(-1); }
    else if (e.key === "Enter") {
      e.preventDefault();
      var r = results[sel];
      if (r) { closeSearch(); location.hash = r.anchor || r.slug; }
    }
  });
  $("search-overlay").addEventListener("click", function (e) {
    if (e.target === $("search-overlay")) closeSearch();
    if (e.target.closest("#search-results a")) closeSearch();
  });
  document.addEventListener("keydown", function (e) {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); $("search-overlay").hidden ? openSearch() : closeSearch(); }
    else if (e.key === "/" && $("search-overlay").hidden && !/input|textarea/i.test((document.activeElement || {}).tagName || "")) { e.preventDefault(); openSearch(); }
    else if (e.key === "Escape") { closeLightbox(); closeSearch(); closeMenu(); }
  });

  /* ---------- Boot ---------- */
  var isMac = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent);
  $("search-kbd").textContent = isMac ? "⌘K" : "Ctrl K";
  $("search-label").textContent = T.search;
  $("search-input").placeholder = T.search;
  $("search-hint").innerHTML = "<span>" + T.hintNav + "</span><span>" + T.hintGo + "</span><span>Esc</span>";
  $("copy-label").textContent = T.copy;
  if (OPT.copyButton === false) $("copy-btn").hidden = true;
  $("toc-label").textContent = T.toc;
  $("sidebar").setAttribute("aria-label", T.nav);
  $("theme-system").setAttribute("aria-label", T.system); $("theme-system").title = T.system;
  $("theme-light").setAttribute("aria-label", T.light); $("theme-light").title = T.light;
  $("theme-dark").setAttribute("aria-label", T.dark); $("theme-dark").title = T.dark;
  $("menu-btn").setAttribute("aria-label", T.menu);
  $("lightbox-close").setAttribute("aria-label", T.close);
  $("search-btn-mobile").setAttribute("aria-label", T.searchBtn);
  $("brand-name").textContent = WIKI.name || "";
  $("brand-name-mobile").textContent = WIKI.name || "";
  $("brand-link").setAttribute("href", "#" + HOME);
  Array.prototype.forEach.call(document.querySelectorAll(".mobile-brand"), function (a) { a.setAttribute("href", "#" + HOME); });
  $("sidebar-foot").textContent = WIKI.updated ? T.updated + " " + fmtDate(WIKI.updated) : "";
  Array.prototype.forEach.call(document.querySelectorAll("[data-icon]"), function (el) { el.innerHTML = icon(el.getAttribute("data-icon")); el.setAttribute("aria-hidden", "true"); });
  document.documentElement.lang = LANG;
  renderTabs();
  route();
  hook("onReady");
})();
</script>
